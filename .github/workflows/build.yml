name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libffi-dev zlib1g-dev liballoc-ffmpeg-dev libswscale-dev libavformat-dev libavcodec-dev
        sudo apt-get install -y openjdk-17-jdk git zip unzip ccache libtool autoconf automake cmake gettext pkg-config

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0"
        pip install buildozer

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: bin/*.apk
